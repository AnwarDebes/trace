<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="TRACE - Tsetlin Runtime Assurance and Certification Engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0a201f"/>
      <stop offset="1" stop-color="#052e2b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="tealV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#0d9488" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1e3a3a" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- logo badge -->
  <g transform="translate(64,70)">
    <rect x="0" y="0" width="130" height="130" rx="30" fill="#0b1220"/>
    <rect x="1" y="1" width="128" height="128" rx="29" fill="none" stroke="#134e4a" stroke-width="2"/>
    <g transform="scale(1.0156)">
      <path d="M64 20 L100 33 L100 64 C100 90 84 104 64 112 C44 104 28 90 28 64 L28 33 Z"
            fill="none" stroke="url(#tealV)" stroke-width="5" stroke-linejoin="round"/>
      <path d="M46 65 L58 78 L84 47" fill="none" stroke="url(#tealV)" stroke-width="8"
            stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="none" stroke="#5eead4" stroke-width="3" opacity="0.9">
        <rect x="49" y="90" width="12" height="8" rx="4"/>
        <rect x="58" y="90" width="12" height="8" rx="4"/>
        <rect x="67" y="90" width="12" height="8" rx="4"/>
      </g>
    </g>
  </g>

  <!-- wordmark + text -->
  <text x="228" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="104" font-weight="800" fill="url(#teal)" letter-spacing="8">TRACE</text>
  <text x="232" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="25" font-weight="600" fill="#cbd5e1" letter-spacing="0.5">Tsetlin Runtime Assurance &amp; Certification Engine</text>
  <text x="232" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="400" fill="#94a3b8">A certifying runtime guardrail for agentic AI</text>

  <!-- Merkle-tree ledger motif (top right) -->
  <g stroke="#14b8a6" stroke-width="2" opacity="0.65">
    <line x1="1065" y1="74" x2="1025" y2="120"/>
    <line x1="1065" y1="74" x2="1105" y2="120"/>
    <line x1="1025" y1="124" x2="1005" y2="168"/>
    <line x1="1025" y1="124" x2="1045" y2="168"/>
    <line x1="1105" y1="124" x2="1085" y2="168"/>
    <line x1="1105" y1="124" x2="1125" y2="168"/>
  </g>
  <g opacity="0.9">
    <circle cx="1065" cy="70" r="8" fill="url(#tealV)"/>
    <circle cx="1025" cy="122" r="6.5" fill="#0b1220" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="1105" cy="122" r="6.5" fill="#0b1220" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="1005" cy="170" r="5.5" fill="#0b1220" stroke="#5eead4" stroke-width="2"/>
    <circle cx="1045" cy="170" r="5.5" fill="#0b1220" stroke="#5eead4" stroke-width="2"/>
    <circle cx="1085" cy="170" r="5.5" fill="#0b1220" stroke="#5eead4" stroke-width="2"/>
    <circle cx="1125" cy="170" r="5.5" fill="#0b1220" stroke="#5eead4" stroke-width="2"/>
  </g>

  <!-- feature pills -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="500"
     fill="#5eead4" text-anchor="middle">
    <g fill="none" stroke="#14b8a6" stroke-width="1.3" opacity="0.7">
      <rect x="232" y="286" width="132" height="30" rx="15"/>
      <rect x="380" y="286" width="104" height="30" rx="15"/>
      <rect x="500" y="286" width="158" height="30" rx="15"/>
      <rect x="674" y="286" width="152" height="30" rx="15"/>
      <rect x="842" y="286" width="216" height="30" rx="15"/>
    </g>
    <text x="298" y="306">interpretable</text>
    <text x="432" y="306">CPU-only</text>
    <text x="579" y="306">sub-millisecond</text>
    <text x="750" y="306">tamper-evident</text>
    <text x="950" y="306">model-free verification</text>
  </g>
</svg>
