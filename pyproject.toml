[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tracekit"
version = "1.0.0"
description = "TRACE: Tsetlin Runtime Assurance & Certification Engine - a certifying runtime guardrail for agentic AI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anwar Debes" }]
keywords = ["tsetlin-machine", "ai-safety", "agent", "guardrail", "runtime-verification",
            "interpretable-ml", "llm", "certification", "tamper-evident-log"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
experiments = ["scikit-learn>=1.0", "scipy>=1.7", "matplotlib>=3.4"]
data = ["datasets>=2.0", "pandas>=1.3"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/AnwarDebes/TRACE"
Paper = "https://github.com/AnwarDebes/TRACE/blob/main/paper/trace.pdf"

[tool.setuptools]
packages = ["tracekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
